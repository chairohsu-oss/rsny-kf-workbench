<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSNY 聚合客服工作台</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;overflow:hidden;color:#1a1a2e}
:root{--brand:#666;--bg:#fff;--sidebar:#f7f7f8;--border:#e5e5e5;--border-light:#ececf1;--text:#1a1a2e;--text2:#8e8ea0;--text3:#acacbe;--danger:#ef4444;--warning:#999;--success:#666}
.sb::-webkit-scrollbar{width:4px}.sb::-webkit-scrollbar-track{background:transparent}.sb::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:10px}.sb::-webkit-scrollbar-thumb:hover{background:#9ca3af}
.bubble-user{background:#f0f0f0;color:#1a1a2e;border-radius:18px 2px 18px 18px}
.bubble-ai{background:#666;color:#fff;border-radius:2px 18px 18px 18px}
.bubble-agent{background:#f0f0f0;color:#555;border:1px solid #fde68a;border-radius:2px 18px 18px 18px}
@keyframes ringPulse{0%,100%{box-shadow:0 0 0 3px #ef4444}50%{box-shadow:0 0 0 2px rgba(239,68,68,.4)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.unread-ring{animation:ringPulse 1.4s ease-in-out infinite,floatY 2s ease-in-out infinite}
.btn-primary{background:#555;color:#fff;border:none;cursor:pointer;transition:background .15s,transform .1s}.btn-primary:hover{background:#444}.btn-primary:active{transform:scale(.97)}
.btn-secondary{background:#8e8ea0;color:#fff;border:none;cursor:pointer;transition:background .15s,transform .1s}.btn-secondary:hover{background:#7a7a8a}.btn-secondary:active{transform:scale(.97)}
.btn-danger{background:#8e8ea0;color:#fff;border:none;cursor:pointer;transition:background .15s,transform .1s}.btn-danger:hover{background:#6b6b7a}.btn-danger:active{transform:scale(.97)}
textarea{resize:none}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,createContext,useContext,Fragment}=React;

/* ─── Config ─── */
const API='https://qt1.chengyujewelry.cn/api/kf';
const AUTH='rsny@1234';
const hdrs=()=>({'Content-Type':'application/json','x-admin-key':AUTH,'Authorization':'Bearer '+AUTH});
const api=async(p,o={})=>{const r=await fetch(API+p,{...o,headers:{...hdrs(),...(o.headers||{})}});if(!r.ok)throw new Error('API '+r.status);return r.json();};

/* ─── Channels ─── */
const CHANNELS=[
  {id:'wxmini',name:'RSNY官方精品店',platform:'小程序',icon:'mini',status:'online'},
  {id:'wxshop',name:'RSNY新品推荐官',platform:'微信小店',icon:'shop',status:'online'},
  {id:'official',name:'RSNY公众号',platform:'公众号',icon:'mp',status:'pending'},
];

/* ─── SVG Icons ─── */
const Icons={
  mini:React.createElement('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none'},
    React.createElement('rect',{x:3,y:3,width:8,height:8,rx:2,fill:'#07C160',opacity:0.85}),
    React.createElement('rect',{x:13,y:13,width:8,height:8,rx:2,fill:'#07C160',opacity:0.55}),
    React.createElement('rect',{x:13,y:3,width:8,height:8,rx:2,fill:'#07C160',opacity:0.35})),
  shop:React.createElement('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'#07C160',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'},
    React.createElement('path',{d:'M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0'})),
  mp:React.createElement('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none'},
    React.createElement('path',{d:'M12 2C6.5 2 2 6 2 10.5c0 3 2 5.5 4 7l1.5 1.5c.5.5 1.3.5 1.7 0l1.3-1.3c.3-.3.8-.3 1.1 0l1.3 1.3c.5.5 1.3.5 1.7 0l1.3-1.3c.3-.3.8-.3 1.1 0l1 1c2-1.5 4-4 4-7C22 6 17.5 2 12 2z',fill:'#07C160',opacity:0.6}),
    React.createElement('circle',{cx:9,cy:9,r:1.5,fill:'#fff'}),
    React.createElement('circle',{cx:15,cy:9,r:1.5,fill:'#fff'})),
  settings:React.createElement('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'},
    React.createElement('path',{d:'M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.15-.08a2 2 0 00-2.73.73l-.22.38a2 2 0 00.73 2.73l.15.1a2 2 0 011 1.72v.51a2 2 0 01-1 1.74l-.15.09a2 2 0 00-.73 2.73l.22.38a2 2 0 002.73.73l.15-.08a2 2 0 012 0l.43.25a2 2 0 011 1.73V20a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.15.08a2 2 0 002.73-.73l.22-.39a2 2 0 00-.73-2.73l-.15-.08a2 2 0 01-1-1.74v-.5a2 2 0 011-1.74l.15-.09a2 2 0 00.73-2.73l-.22-.38a2 2 0 00-2.73-.73l-.15.08a2 2 0 01-2 0l-.43-.25a2 2 0 01-1-1.73V4a2 2 0 00-2-2z'}),
    React.createElement('circle',{cx:12,cy:12,r:3})),
  attach:React.createElement('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'#8e8ea0',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'},
    React.createElement('path',{d:'M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48'})),
  emoji:React.createElement('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'#8e8ea0',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'},
    React.createElement('circle',{cx:12,cy:12,r:10}),
    React.createElement('path',{d:'M8 14s1.5 2 4 2 4-2 4-2'}),
    React.createElement('line',{x1:'9',y1:'9',x2:'9.01',y2:'9'}),
    React.createElement('line',{x1:'15',y1:'9',x2:'15.01',y2:'9'})),
  quick:React.createElement('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'#8e8ea0',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'},
    React.createElement('path',{d:'M13 2L3 14h9l-1 8 10-12h-9l1-8z'})),
};

/* ─── Formatters ─── */
function fmtTime(d){if(!d)return'';const t=new Date(d),n=new Date(),diff=n-t;if(diff<60000)return'刚刚';if(diff<3600000)return Math.floor(diff/60000)+'分钟前';if(diff<86400000)return t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');return(t.getMonth()+1)+'/'+t.getDate();}
function fmtFull(d){if(!d)return'';const t=new Date(d);return t.getHours()+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0');}

/* ─── Auth ─── */
const AuthCtx=createContext(null);
function AuthProvider({children}){
  const[t,setT]=useState(()=>localStorage.getItem('kf_token')||'');
  const login=p=>{if(p===AUTH){const tk=btoa(AUTH+':'+Date.now());localStorage.setItem('kf_token',tk);setT(tk);return true;}return false;};
  const logout=()=>{localStorage.removeItem('kf_token');setT('');};
  return React.createElement(AuthCtx.Provider,{value:{token:t,login,logout}},children);
}
function useAuth(){return useContext(AuthCtx);}

/* ─── Login ─── */
function LoginPage(){
  const{login}=useAuth();const[p,setP]=useState('');const[e,setE]=useState('');
  const submit=ev=>{ev.preventDefault();if(login(p))return;setE('密码错误');setTimeout(()=>setE(''),2000);};
  return React.createElement('div',{className:'min-h-screen flex items-center justify-center',style:{background:'linear-gradient(135deg,#444 0%,#666 100%)'}},
    React.createElement('div',{className:'bg-white rounded-2xl shadow-xl p-8 w-96'},
      React.createElement('div',{className:'text-center mb-8'},
        React.createElement('div',{className:'w-14 h-14 rounded-xl flex items-center justify-center mx-auto mb-4',style:{background:'#666'}},
          React.createElement('span',{className:'text-white text-xl font-bold'},'R')
        ),
        React.createElement('h1',{className:'text-xl font-bold'},'RSNY 客服工作台'),
        React.createElement('p',{className:'text-sm mt-1',style:{color:'#8e8ea0'}},'多渠道聚合 · AI智能回复 · 人工接管')
      ),
      React.createElement('form',{onSubmit:submit},
        React.createElement('input',{type:'password',value:p,onChange:ev=>setP(ev.target.value),placeholder:'请输入管理密码',
          className:'w-full px-4 py-3 border rounded-xl text-center text-lg focus:outline-none focus:ring-2',style:{borderColor:'#e5e5e5'},autoFocus:true}),
        e&&React.createElement('p',{className:'text-red-500 text-center mt-2 text-sm'},e),
        React.createElement('button',{type:'submit',className:'w-full mt-4 py-3 text-white rounded-xl font-medium transition',style:{background:'#666'}},'登 录')
      ),
      React.createElement('p',{className:'text-center text-xs mt-4',style:{color:'#acacbe'}},'v3.0 · 四栏导航 · 渠道会话对话面板')
    )
  );
}

/* ─── ChannelBar (~70px) ─── */
function ChannelBar({channels,activeChannelId,onSelect,unreadCounts,conversations,onSettings}){
  return React.createElement('div',{className:'flex flex-col h-full select-none',style:{width:'160px',background:'#f7f7f8',borderRight:'1px solid #e5e5e5'}},
    React.createElement('div',{className:'flex-1 overflow-y-auto sb pt-3'},
      channels.map(ch=>{
        const isActive=activeChannelId===ch.id;
        const chUnread=conversations.filter(c=>c.channel_id===ch.id).reduce((s,c)=>s+(unreadCounts[c.id]||0),0);
        const chTotal=conversations.filter(c=>c.channel_id===ch.id).length;
        return React.createElement('div',{key:ch.id,onClick:()=>onSelect(ch.id),
          className:'relative flex flex-col items-center justify-center cursor-pointer transition-colors',
          style:{height:'72px',background:isActive?'#fff':'transparent',borderLeft:isActive?'3px solid #07C160':'3px solid transparent'}},
          React.createElement('div',{className:'relative'},
            React.createElement('div',{className:chUnread>0?'unread-ring':'',style:{opacity:ch.status==='pending'?.4:1,borderRadius:'50%',display:'inline-flex'}},Icons[ch.icon])
          ),
          React.createElement('span',{className:'text-xs truncate w-full text-center',style:{color:isActive?'#1a1a2e':'#8e8ea0',fontSize:'11px',fontWeight:isActive?600:400}},ch.name),
          React.createElement('span',{className:'text-xs',style:{color:'#acacbe',fontSize:'10px'}},chTotal>0?'('+chTotal+')':'')
        );
      })
    ),
    React.createElement('div',{className:'p-2 border-t',style:{borderColor:'#e5e5e5'}},
      React.createElement('button',{onClick:onSettings,className:'w-full flex items-center justify-center py-2 rounded-lg hover:bg-white transition',title:'系统设置'},Icons.settings)
    )
  );
}

/* ─── ConversationList (~240px) ─── */
function ConversationList({conversations,activeConv,onSelect,unreadCounts}){
  return React.createElement('div',{className:'flex flex-col h-full',style:{width:'240px',background:'#fff',borderRight:'1px solid #e5e5e5'}},
    React.createElement('div',{className:'px-3 py-3 border-b',style:{borderColor:'#ececf1'}},
      React.createElement('span',{className:'font-semibold text-sm'},'会话'),
      React.createElement('span',{className:'ml-2 text-xs',style:{color:'#8e8ea0'}},conversations.length+' 个')
    ),
    React.createElement('div',{className:'flex-1 overflow-y-auto sb'},
      conversations.length===0?
        React.createElement('div',{className:'text-center py-12'},
          React.createElement('p',{className:'text-3xl mb-2'},''),
          React.createElement('p',{className:'text-sm',style:{color:'#8e8ea0'}},'暂无会话'),
          React.createElement('p',{className:'text-xs mt-1',style:{color:'#acacbe'}},'等待客户发送消息')
        )
      :conversations.map(conv=>{
        const isActive=activeConv?.id===conv.id;
        const unread=unreadCounts[conv.id]||0;
        const isHandled=conv.handler==='human';
        return React.createElement('div',{key:conv.id,onClick:()=>onSelect(conv),
          className:'flex items-start gap-2.5 px-3 py-3 cursor-pointer transition-colors',
          style:{background:isActive?'#f0f0f0':'transparent',borderLeft:isActive?'3px solid #07C160':'3px solid transparent'}},
          React.createElement('div',{className:'relative flex-shrink-0'},
            React.createElement('div',{className:'w-9 h-9 rounded-full flex items-center justify-center text-sm font-medium'+(unread>0?' unread-ring':''),style:{background:isHandled?'#f0f0f0':'#e8f5ef',color:isHandled?'#555':'#07C160',boxShadow:unread>0?'none':'0 0 0 0 transparent'}},
              (conv.user_nickname||conv.user_id||'?').charAt(0).toUpperCase()
            )
          ),
          React.createElement('div',{className:'flex-1 min-w-0'},
            React.createElement('div',{className:'flex items-center justify-between'},
              React.createElement('span',{className:'text-sm font-medium truncate',style:{color:'#1a1a2e'}},conv.user_nickname||conv.user_id?.slice(0,8)||'匿名'),
              React.createElement('span',{className:'text-xs flex-shrink-0',style:{color:'#8e8ea0'}},fmtTime(conv.last_message_at))
            ),
            React.createElement('div',{className:'mt-0.5'},
              React.createElement('span',{className:'text-xs truncate block',style:{color:'#8e8ea0'}},conv.last_message_preview||'无消息')
            ),
            React.createElement('div',{className:'mt-0.5'},
              isHandled?React.createElement('span',{className:'text-xs font-medium',style:{color:'#999'}},'🧑 人工接管中'):
              conv.status==='closed'?React.createElement('span',{className:'text-xs',style:{color:'#8e8ea0'}},'🔒 已结束'):
              React.createElement('span',{className:'text-xs',style:{color:'#666'}},'🤖 AI 服务中')
            )
          )
        );
      })
    )
  );
}

/* ─── ChatArea (flex:1) ─── */
function ChatArea({activeConv,messages,onSend,onTakeover,onHandback,onClose,quickReplies}){
  const[input,setInput]=useState('');
  const[showQuick,setShowQuick]=useState(false);
  const endRef=useRef(null);
  const taRef=useRef(null);
  const handler=activeConv?.handler||'ai';
  const isHandling=handler==='human';
  const isClosed=activeConv?.status==='closed';

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:'smooth'});},[messages]);

  const send=()=>{if(!input.trim()||!activeConv||isClosed)return;onSend(input.trim());setInput('');if(taRef.current)taRef.current.style.height='auto';};
  const handleKey=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
  const autoResize=()=>{if(taRef.current){taRef.current.style.height='auto';taRef.current.style.height=Math.min(taRef.current.scrollHeight,120)+'px';}};

  if(!activeConv)return React.createElement('div',{className:'flex-1 flex items-center justify-center',style:{background:'#fff'}},
    React.createElement('div',{className:'text-center'},
      React.createElement('div',{className:'text-6xl mb-4',style:{color:'#ececf1'}},''),
      React.createElement('p',{className:'text-lg font-medium',style:{color:'#8e8ea0'}},'选择一个会话开始'),
      React.createElement('p',{className:'text-sm mt-1',style:{color:'#acacbe'}},'从左侧列表点击会话即可查看对话')
    )
  );

  const channelLabel=activeConv.channel_id?.includes('wxshop')?'微信小店':activeConv.channel_id?.includes('wxmini')?'小程序':activeConv.channel_id?.includes('official')?'公众号':activeConv.channel_id||'未知';

  return React.createElement('div',{className:'flex-1 flex flex-col',style:{background:'#fff'}},
    /* Header */
    React.createElement('div',{className:'flex items-center justify-between px-5 py-3 border-b',style:{borderColor:'#ececf1'}},
      React.createElement('div',{className:'flex items-center gap-3'},
        React.createElement('div',{className:'w-9 h-9 rounded-full flex items-center justify-center font-medium text-sm',style:{background:'#f0f0f0',color:'#666'}},
          (activeConv.user_nickname||activeConv.user_id||'?').charAt(0).toUpperCase()
        ),
        React.createElement('div',null,
          React.createElement('div',{className:'font-medium text-sm'},activeConv.user_nickname||activeConv.user_id?.slice(0,10)||'匿名'),
          React.createElement('div',{className:'flex items-center gap-2'},
            React.createElement('span',{className:'text-xs px-1.5 py-0.5 rounded',style:{background:'#f0f0f0',color:'#666'}},channelLabel),
            isHandling?React.createElement('span',{className:'text-xs font-medium',style:{color:'#999'}},'🧑 人工接管中'):
            isClosed?React.createElement('span',{className:'text-xs',style:{color:'#8e8ea0'}},'🔒 已结束'):
            React.createElement('span',{className:'text-xs',style:{color:'#07C160'}},'🤖 AI 服务中')
          )
        )
      ),
      React.createElement('div',{className:'flex gap-2'},
        !isHandling&&!isClosed&&React.createElement('button',{onClick:onTakeover,className:'px-3 py-1.5 text-white text-xs rounded-lg font-medium btn-primary'},'🧑 接管'),
        isHandling&&React.createElement('button',{onClick:onHandback,className:'px-3 py-1.5 text-white text-xs rounded-lg font-medium btn-primary'},'🤖 交还'),
        !isClosed&&React.createElement('button',{onClick:onClose,className:'px-3 py-1.5 text-white text-xs rounded-lg font-medium btn-danger'},'结束')
      )
    ),
    /* Messages */
    React.createElement('div',{className:'flex-1 overflow-y-auto sb px-5 py-4',style:{background:'#f7f7f8'}},
      messages.length===0?
        React.createElement('div',{className:'text-center py-20'},
          React.createElement('p',{style:{color:'#8e8ea0'}},'暂无消息记录'),
          React.createElement('p',{className:'text-sm mt-1',style:{color:'#acacbe'}},'客户发送消息后将自动回复')
        )
      :React.createElement(Fragment,null,
        messages.map((msg,i)=>{
          const isUser=msg.sender==='user';const isAgent=msg.sender==='agent';
          const cls=isUser?'bubble-user':isAgent?'bubble-agent':'bubble-ai';
          const senderLabel=isAgent?'人工客服':isUser?(activeConv.user_nickname?.slice(0,6)||'用户'):'AI助手';
          const prevMsg=messages[i-1];
          const showTime=!prevMsg||new Date(msg.created_at)-new Date(prevMsg.created_at)>300000;
          return React.createElement(Fragment,{key:i},
            showTime&&React.createElement('div',{className:'text-center my-3'},
              React.createElement('span',{className:'text-xs px-3 py-1 rounded-full',style:{background:'#ececf1',color:'#8e8ea0'}},fmtFull(msg.created_at))
            ),
            React.createElement('div',{className:'flex mb-3 '+(isUser?'justify-start':'justify-end')},
              isUser&&React.createElement('div',{className:'w-7 h-7 rounded-full flex-shrink-0 mr-2 flex items-center justify-center text-xs',style:{background:'#f0f0f0',color:'#666'}},(activeConv.user_nickname||'?').charAt(0).toUpperCase()),
              React.createElement('div',{className:'max-w-[70%]'},
                !isUser&&React.createElement('div',{className:'text-xs mb-1',style:{color:isAgent?'#555':'#666'}},senderLabel),
                React.createElement('div',{className:cls,style:{padding:'10px 14px',fontSize:'14px',lineHeight:'1.5',wordBreak:'break-word'}},msg.content||msg.ai_reply)
              ),
              !isUser&&React.createElement('div',{className:'w-7 h-7 rounded-full flex-shrink-0 ml-2 flex items-center justify-center text-xs',style:{background:isAgent?'#f0f0f0':'#f0f0f0',color:isAgent?'#555':'#666'}},isAgent?'🧑':'🤖')
            )
          );
        }),
        React.createElement('div',{ref:endRef})
      )
    ),
    /* Input */
    isClosed?
      React.createElement('div',{className:'p-4 text-center text-sm',style:{background:'#f7f7f8',color:'#8e8ea0',borderTop:'1px solid #ececf1'}},'🔒 会话已结束')
    :
      React.createElement('div',{className:'border-t relative',style:{borderColor:'#ececf1'}},
        showQuick&&React.createElement('div',{className:'absolute bottom-full left-0 right-0 mb-2 mx-4 bg-white rounded-xl shadow-lg overflow-hidden z-50',style:{border:'1px solid #e5e5e5',maxHeight:'200px'}},
          React.createElement('div',{className:'flex items-center justify-between px-3 py-2 border-b',style:{borderColor:'#ececf1'}},
            React.createElement('span',{className:'text-xs font-medium'},'快捷回复模板'),
            React.createElement('button',{onClick:()=>setShowQuick(false),className:'text-sm',style:{color:'#8e8ea0'}},'×')
          ),
          React.createElement('div',{className:'overflow-y-auto sb'},
            (quickReplies||[]).map((qr,i)=>React.createElement('div',{key:i,onClick:()=>{onSend(qr.content);setShowQuick(false);},

              React.createElement('span',{className:'text-sm font-medium'},qr.title),

        ),

          React.createElement('button',{className:'p-1.5 rounded hover:bg-gray-100 transition',title:'上传文件'},Icons.attach),
          React.createElement('button',{className:'p-1.5 rounded hover:bg-gray-100 transition',title:'表情'},Icons.emoji),
          React.createElement('button',{onClick:()=>setShowQuick(!showQuick),className:'p-1.5 rounded hover:bg-gray-100 transition',title:'快捷回复',style:{color:showQuick?'#666':'#8e8ea0'}},Icons.quick)
        ),
        React.createElement('div',{className:'px-4 pb-3'},
          React.createElement('textarea',{ref:taRef,value:input,onChange:e=>{setInput(e.target.value);autoResize();},onKeyDown:handleKey,

/* ─── SettingsModal ─── */
const SETTINGS_API='https://qt1.chengyujewelry.cn/api/kf/settings';

function SettingsModal({onClose}){
  const[tab,setTab]=useState('ai');
  const[settings,setSettings]=useState(null);
  const[aiModel,setAiModel]=useState('');const[aiKey,setAiKey]=useState('');
  const[newFactContent,setNewFactContent]=useState('');
  const[newQRTitle,setNewQRTitle]=useState('');const[newQRContent,setNewQRContent]=useState('');
  const[msg,setMsg]=useState('');

  useEffect(()=>{
    fetch(SETTINGS_API,{headers:{'x-admin-key':AUTH}}).then(r=>r.json()).then(d=>{
      setSettings(d);setAiModel(d.ai?.model||'');setAiKey('');
    }).catch(e=>setMsg('加载失败: '+e.message));
  },[]);

  const saveAi=async()=>{
    const r=await fetch(SETTINGS_API+'/ai',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':AUTH},body:JSON.stringify({model:aiModel,apiKey:aiKey})});
    const d=await r.json();
    if(d.ok){setMsg('✅ AI配置已保存');setAiKey('');if(settings){const s={...settings};s.ai.model=aiModel;s.ai.apiKeyMasked=d.keyMasked;setSettings(s);}}
    else setMsg('❌ 保存失败');
  };
  const addFact=async()=>{
    if(!newFactContent.trim())return;
    const r=await fetch(SETTINGS_API+'/brand-facts',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':AUTH},body:JSON.stringify({content:newFactContent.trim()})});
    const d=await r.json();if(d.ok){setNewFactContent('');setMsg('✅ 已添加');fetch(SETTINGS_API,{headers:{'x-admin-key':AUTH}}).then(r=>r.json()).then(setSettings);}else setMsg('❌ 失败');
  };
  const delFact=async(id)=>{
    if(!confirm('确定删除？'))return;
    await fetch(SETTINGS_API+'/brand-facts/'+id,{method:'DELETE',headers:{'x-admin-key':AUTH}});setMsg('🗑 已删除');fetch(SETTINGS_API,{headers:{'x-admin-key':AUTH}}).then(r=>r.json()).then(setSettings);

    const d=await r.json();if(d.ok){setNewQRTitle('');setNewQRContent('');setMsg('✅ 已添加');fetch(SETTINGS_API,{headers:{'x-admin-key':AUTH}}).then(r=>r.json()).then(setSettings);}else setMsg('❌ 失败');
  };
  const delQR=async(id)=>{
    if(!confirm('确定删除？'))return;
    await fetch(SETTINGS_API+'/quick-replies/'+id,{method:'DELETE',headers:{'x-admin-key':AUTH}});setMsg('🗑 已删除');fetch(SETTINGS_API,{headers:{'x-admin-key':AUTH}}).then(r=>r.json()).then(setSettings);
  };

  if(!settings)return React.createElement('div',{className:'fixed inset-0 bg-black/40 flex items-center justify-center z-50'},React.createElement('div',{className:'bg-white rounded-2xl p-8'},React.createElement('p',null,'加载中...')));

  const tabs=['ai','channels','facts','quick'];

  return React.createElement('div',{className:'fixed inset-0 bg-black/40 flex items-center justify-center z-50',onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    React.createElement('div',{className:'bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden'},
      React.createElement('div',{className:'flex items-center justify-between px-6 py-4 border-b',style:{borderColor:'#ececf1'}},
        React.createElement('h2',{className:'text-lg font-bold'},'⚙ 系统配置管理'),
        React.createElement('button',{onClick:onClose,className:'text-gray-400 hover:text-gray-600 text-2xl leading-none'},'×')
      ),
      React.createElement('div',{className:'flex border-b',style:{borderColor:'#ececf1'}},
        tabs.map(t=>React.createElement('button',{key:t,onClick:()=>setTab(t),className:'px-5 py-3 text-sm font-medium transition',style:{color:tab===t?'#666':'#8e8ea0',borderBottom:tab===t?'2px solid #666':'2px solid transparent'}},tabNames[t]))
      ),
      React.createElement('div',{className:'flex-1 overflow-y-auto sb p-6'},
        msg&&React.createElement('div',{className:'mb-4 px-4 py-2 rounded-lg text-sm',style:{background:'#f0f0f0',color:'#666'}},msg),
        tab==='ai'&&React.createElement('div',{className:'space-y-4'},
          React.createElement('div',null,
            React.createElement('label',{className:'block text-sm font-medium mb-1',style:{color:'#8e8ea0'}},'AI 模型'),
            React.createElement('input',{value:aiModel,onChange:e=>setAiModel(e.target.value),className:'w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-1',style:{borderColor:'#e5e5e5'},placeholder:'deepseek-v4-flash'})
          ),
          React.createElement('div',null,
            React.createElement('label',{className:'block text-sm font-medium mb-1',style:{color:'#8e8ea0'}},'API Key'),
            React.createElement('div',{className:'flex items-center gap-2'},
              React.createElement('span',{className:'text-xs px-3 py-2 rounded',style:{background:'#f7f7f8',color:'#8e8ea0'}},'当前: ',settings.ai?.apiKeyMasked||'未配置'),

            React.createElement('h3',{className:'font-medium text-sm mb-2'},val.channel),
            React.createElement('p',{className:'text-xs mb-3 bg-gray-50 p-3 rounded'},val.base),
            React.createElement('div',{className:'flex flex-wrap gap-1'},val.guidelines.map((g,i)=>React.createElement('span',{key:i,className:'px-2 py-0.5 text-xs rounded-full',style:{background:'#f0f0f0',color:'#666'}},g)))
          ))
        ),
        tab==='facts'&&React.createElement('div',{className:'space-y-3'},
          React.createElement('div',{className:'flex gap-2'},
            React.createElement('input',{value:newFactContent,onChange:e=>setNewFactContent(e.target.value),className:'flex-1 px-3 py-2 border rounded-lg text-sm',style:{borderColor:'#e5e5e5'},placeholder:'输入新的品牌知识...'}),
            React.createElement('button',{onClick:addFact,className:'px-4 py-2 text-white rounded-lg text-sm',style:{background:'#666'}},'添加')
          ),
          (settings.brandFacts||[]).map(f=>React.createElement('div',{key:f.id,className:'flex items-center justify-between bg-white rounded-lg p-3 border',style:{borderColor:'#e5e5e5'}},
            React.createElement('span',{className:'text-sm flex-1'},f.content),

/* ─── Workbench ─── */
function Workbench(){
  const[conversations,setConversations]=useState([]);
  const[activeConv,setActiveConv]=useState(null);
  const[messages,setMessages]=useState([]);
  const[quickReplies,setQuickReplies]=useState([]);
  const[unreadCounts,setUnreadCounts]=useState({});
  const[activeChannelId,setActiveChannelId]=useState('wxmini');
  const[loading,setLoading]=useState(true);
  const[showSettings,setShowSettings]=useState(false);

  // Filter conversations by active channel
  const filteredConversations=conversations.filter(c=>c.channel_id===activeChannelId);

  const fetchSessions=useCallback(async()=>{
    try{
      const data=await api('/sessions');
      if(data.sessions){
        setConversations(prev=>{
          data.sessions.forEach(s=>{
            const p=prev.find(x=>x.id===s.id);
            if(p&&s.unread_count>(p.unread_count||0)){
              setUnreadCounts(x=>({...x,[s.id]:(x[s.id]||0)+(s.unread_count-(p.unread_count||0))}));
            }
          });
          return data.sessions;
        });
      }
    }catch(e){console.error('fetchSessions:',e);}
    setLoading(false);
  },[]);

  const fetchMessages=useCallback(async(cid)=>{
    if(!cid)return;
    try{
      const data=await api('/sessions/'+cid+'/messages');
      if(data.messages)setMessages(data.messages);
    }catch(e){}
  },[]);

  const fetchQR=useCallback(async()=>{
    try{const d=await api('/quick-replies');if(d.replies)setQuickReplies(d.replies);}catch(e){}
  },[]);

  useEffect(()=>{fetchSessions();fetchQR();},[]);

  useEffect(()=>{
    const t=setInterval(()=>{fetchSessions();if(activeConv)fetchMessages(activeConv.id);},3000);
    return()=>clearInterval(t);
  },[activeConv,fetchSessions,fetchMessages]);

  useEffect(()=>{
    if(activeConv){fetchMessages(activeConv.id);setUnreadCounts(prev=>{const n={...prev};delete n[activeConv.id];return n;});}
  },[activeConv?.id,fetchMessages]);

  const handleSend=async(text)=>{
    if(!activeConv)return;
    try{
      await api('/sessions/'+activeConv.id+'/send',{method:'POST',body:JSON.stringify({content:text,sender:'agent'})});
      fetchMessages(activeConv.id);fetchSessions();
    }catch(e){alert('发送失败: '+e.message);}
  };
  const handleTakeover=async()=>{
    if(!activeConv)return;
    try{await api('/sessions/'+activeConv.id+'/takeover',{method:'POST'});setActiveConv({...activeConv,handler:'human'});fetchSessions();fetchMessages(activeConv.id);}catch(e){alert('接管失败: '+e.message);}
  };
  const handleHandback=async()=>{
    if(!activeConv)return;
    try{await api('/sessions/'+activeConv.id+'/handback',{method:'POST'});setActiveConv({...activeConv,handler:'ai'});fetchSessions();fetchMessages(activeConv.id);}catch(e){alert('交还失败: '+e.message);}
  };
  const handleClose=async()=>{
    if(!activeConv)return;
    if(!confirm('确定结束此会话？'))return;
    try{await api('/sessions/'+activeConv.id+'/close',{method:'POST'});fetchSessions();setActiveConv(null);setMessages([]);}catch(e){alert('结束失败: '+e.message);}
  };
  const handleUseQR=(qr)=>{navigator.clipboard.writeText(qr.content).then(()=>alert('已复制: '+qr.title));};

  // When switching channels, deselect conv if it doesn't belong to new channel
  useEffect(()=>{
    if(activeConv&&activeConv.channel_id!==activeChannelId){
      setActiveConv(null);setMessages([]);
    }
  },[activeChannelId]);

  if(loading)return React.createElement('div',{className:'h-screen flex items-center justify-center',style:{background:'#f7f7f8'}},
    React.createElement('div',{className:'text-center'},
      React.createElement('div',{className:'text-4xl mb-4'},'⏳'),
      React.createElement('p',{style:{color:'#8e8ea0'}},'加载中...')
    )
  );

  const handleSelectConv=(conv)=>{
    setUnreadCounts(prev=>{const n={...prev};delete n[conv.id];return n;});
    setActiveConv(conv);
  };

  return React.createElement('div',{className:'h-screen flex'},
    React.createElement(ChannelBar,{channels:CHANNELS,activeChannelId,onSelect:setActiveChannelId,unreadCounts,conversations,onSettings:()=>setShowSettings(true)}),
    React.createElement(ConversationList,{conversations:filteredConversations,activeConv,onSelect:handleSelectConv,unreadCounts}),
    React.createElement(ChatArea,{activeConv,messages,onSend:handleSend,onTakeover:handleTakeover,onHandback:handleHandback,onClose:handleClose,quickReplies}),
    React.createElement(RightPanel,{activeConv,quickReplies,onUseQuickReply:handleUseQR}),
    showSettings&&React.createElement(SettingsModal,{onClose:()=>setShowSettings(false)})
  );
}

/* ─── App ─── */
function App(){
  const{token}=useAuth();
  if(!token)return React.createElement(LoginPage);
  return React.createElement(Workbench);
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(AuthProvider,null,React.createElement(App))
);
</script>

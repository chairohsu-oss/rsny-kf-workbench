<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSNY 客服工作台</title>
<style>
:root {
  --bg: #f5f6fa; --white: #fff; --border: #e4e7ed; --text: #303133; --text2: #909399;
  --primary: #409eff; --primary-light: #ecf5ff; --success: #67c23a; --warning: #e6a23c;
  --danger: #f56c6c; --info: #909399; --shadow: 0 2px 12px rgba(0,0,0,.06);
  --wxshop: #07c160; --wxmini: #576b95; --wechat: #07c160; --xhs: #ff2442; --douyin: #161823;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

/* Login */
.login-wrap { display:flex; align-items:center; justify-content:center; height:100vh; background:linear-gradient(135deg,#667eea,#764ba2); }
.login-box { background:var(--white); border-radius:12px; padding:40px; width:360px; box-shadow:0 20px 60px rgba(0,0,0,.15); }
.login-box h2 { text-align:center; margin-bottom:24px; color:var(--text); }
.login-box input { width:100%; padding:12px 16px; border:1px solid var(--border); border-radius:8px; font-size:15px; outline:none; transition:border .2s; }
.login-box input:focus { border-color:var(--primary); }
.login-box button { width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer; margin-top:16px; }
.login-box button:hover { opacity:.9; }

/* Layout */
.app { display:flex; height:100vh; }

/* Left Sidebar */
.sidebar { width:280px; min-width:280px; background:var(--white); border-right:1px solid var(--border); display:flex; flex-direction:column; }
.sidebar-header { padding:16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.sidebar-header h3 { font-size:16px; font-weight:600; }
.badge { background:var(--danger); color:#fff; font-size:11px; padding:2px 6px; border-radius:10px; min-width:18px; text-align:center; }

/* Channel Nav */
.channel-group { border-bottom:1px solid var(--border); }
.channel-header { padding:10px 16px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; color:var(--text2); user-select:none; }
.channel-header:hover { background:#f5f7fa; }
.channel-header .arrow { transition:transform .2s; font-size:10px; }
.channel-header .arrow.open { transform:rotate(90deg); }
.channel-icon { width:20px; height:20px; border-radius:4px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
.channel-accounts { overflow:hidden; transition:max-height .3s; }
.channel-accounts.collapsed { max-height:0 !important; }

.account-item { padding:8px 16px 8px 44px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); position:relative; }
.account-item:hover { background:#f5f7fa; }
.account-item.active { background:var(--primary-light); color:var(--primary); }
.account-item .unread { position:absolute; right:12px; }

/* Session List */
.session-list { flex:1; overflow-y:auto; }
.session-item { padding:12px 16px; cursor:pointer; border-bottom:1px solid #f0f0f0; display:flex; gap:10px; }
.session-item:hover { background:#f5f7fa; }
.session-item.active { background:var(--primary-light); }
.session-avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#a8c0ff,#3f2b96); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; font-weight:500; flex-shrink:0; }
.session-info { flex:1; min-width:0; }
.session-name { font-size:14px; font-weight:500; display:flex; align-items:center; gap:6px; }
.session-name .handler-tag { font-size:10px; padding:1px 4px; border-radius:3px; }
.handler-tag.ai { background:#e1f3d8; color:#67c23a; }
.handler-tag.human { background:#fdf6ec; color:#e6a23c; }
.session-preview { font-size:12px; color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.session-time { font-size:11px; color:var(--text2); margin-top:2px; }

/* Center Chat */
.chat-area { flex:1; display:flex; flex-direction:column; min-width:0; }
.chat-header { padding:14px 20px; border-bottom:1px solid var(--border); background:var(--white); display:flex; align-items:center; justify-content:space-between; }
.chat-header-left { display:flex; align-items:center; gap:10px; }
.chat-header-left h4 { font-size:15px; }
.channel-tag { font-size:11px; padding:2px 8px; border-radius:4px; color:#fff; }
.chat-actions { display:flex; gap:8px; }
.btn { padding:6px 14px; border-radius:6px; font-size:13px; cursor:pointer; border:1px solid var(--border); background:var(--white); color:var(--text); transition:all .2s; }
.btn:hover { border-color:var(--primary); color:var(--primary); }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { opacity:.9; color:#fff; }
.btn-warning { background:var(--warning); color:#fff; border-color:var(--warning); }
.btn-danger { background:var(--danger); color:#fff; border-color:var(--danger); }

/* Messages */
.chat-messages { flex:1; overflow-y:auto; padding:20px; background:var(--bg); }
.msg-row { margin-bottom:16px; display:flex; gap:10px; }
.msg-row.right { flex-direction:row-reverse; }
.msg-avatar { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:14px; }
.msg-avatar.user { background:#dcdfe6; }
.msg-avatar.ai { background:#67c23a; color:#fff; }
.msg-avatar.human { background:#409eff; color:#fff; }
.msg-bubble { max-width:60%; padding:10px 14px; border-radius:8px; font-size:14px; line-height:1.5; word-break:break-word; }
.msg-row:not(.right) .msg-bubble { background:var(--white); border-top-left-radius:2px; box-shadow:var(--shadow); }
.msg-row.right .msg-bubble { background:var(--primary); color:#fff; border-top-right-radius:2px; }
.msg-time { font-size:11px; color:var(--text2); margin-top:4px; }
.msg-row.right .msg-time { text-align:right; }
.msg-sender { font-size:11px; color:var(--text2); margin-bottom:2px; }

/* Input */
.chat-input { padding:16px 20px; background:var(--white); border-top:1px solid var(--border); }
.quick-reply-bar { margin-bottom:8px; display:flex; gap:6px; flex-wrap:wrap; }
.quick-reply-btn { font-size:12px; padding:3px 10px; border-radius:12px; background:#f0f2f5; cursor:pointer; border:none; color:var(--text); }
.quick-reply-btn:hover { background:var(--primary-light); color:var(--primary); }
.input-row { display:flex; gap:10px; }
.input-row textarea { flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px; resize:none; outline:none; min-height:40px; max-height:120px; }
.input-row textarea:focus { border-color:var(--primary); }
.send-btn { padding:0 20px; background:var(--primary); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px; white-space:nowrap; }
.send-btn:hover { opacity:.9; }
.send-btn:disabled { opacity:.5; cursor:not-allowed; }

/* Empty State */
.empty-state { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text2); }
.empty-state svg { width:80px; height:80px; margin-bottom:16px; opacity:.3; }
.empty-state p { font-size:14px; }

/* Right Panel */
.right-panel { width:320px; min-width:320px; background:var(--white); border-left:1px solid var(--border); display:flex; flex-direction:column; }
.panel-tabs { display:flex; border-bottom:1px solid var(--border); }
.panel-tab { flex:1; padding:12px 8px; text-align:center; cursor:pointer; font-size:13px; color:var(--text2); border-bottom:2px solid transparent; transition:all .2s; }
.panel-tab:hover { color:var(--text); }
.panel-tab.active { color:var(--primary); border-bottom-color:var(--primary); }
.panel-content { flex:1; overflow-y:auto; padding:16px; }
.panel-content .field { margin-bottom:12px; }
.panel-content .field-label { font-size:12px; color:var(--text2); margin-bottom:4px; }
.panel-content .field-value { font-size:14px; }

/* Product card in right panel */
.product-card { border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; cursor:pointer; }
.product-card:hover { border-color:var(--primary); }
.product-card img { width:100%; height:120px; object-fit:cover; border-radius:4px; margin-bottom:8px; }
.product-card .name { font-size:14px; font-weight:500; }
.product-card .price { font-size:14px; color:var(--danger); margin-top:4px; }

.search-box { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:13px; outline:none; margin-bottom:12px; }
.search-box:focus { border-color:var(--primary); }

/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:#c0c4cc; border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:#909399; }

/* Toast */
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:10px 20px; border-radius:8px; color:#fff; font-size:14px; z-index:9999; opacity:0; transition:opacity .3s; }
.toast.show { opacity:1; }
.toast.success { background:var(--success); }
.toast.error { background:var(--danger); }
.toast.info { background:var(--primary); }
</style>
</head>
<body>

<!-- Login -->
<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <h2>🎧 RSNY 客服工作台</h2>
    <input type="password" id="loginPwd" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- Main App -->
<div id="appPage" class="app" style="display:none">
  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h3>消息</h3>
      <span id="totalUnread" class="badge" style="display:none"></span>
    </div>
    <div id="channelNav"></div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <!-- Center Chat -->
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyChat">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/></svg>
      <p>选择一个会话开始聊天</p>
    </div>
    <div id="chatView" style="display:none">
      <div class="chat-header">
        <div class="chat-header-left">
          <h4 id="chatUserName"></h4>
          <span id="chatChannelTag" class="channel-tag"></span>
          <span id="chatHandlerTag" class="handler-tag"></span>
        </div>
        <div class="chat-actions">
          <button id="btnTakeover" class="btn btn-warning" onclick="takeoverSession()" style="display:none">👤 接管</button>
          <button id="btnHandback" class="btn btn-primary" onclick="handbackSession()" style="display:none">🤖 交还AI</button>
          <button id="btnClose" class="btn btn-danger" onclick="closeSession()" style="display:none">结束会话</button>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input" id="chatInputArea" style="display:none">
        <div class="quick-reply-bar" id="quickReplyBar"></div>
        <div class="input-row">
          <textarea id="msgInput" placeholder="输入消息，Enter发送，Shift+Enter换行" rows="1" onkeydown="handleInputKey(event)"></textarea>
          <button class="send-btn" onclick="sendMessage()" id="sendBtn">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel" id="rightPanel">
    <div class="panel-tabs">
      <div class="panel-tab active" data-tab="customer" onclick="switchTab('customer')">👤 客户</div>
      <div class="panel-tab" data-tab="product" onclick="switchTab('product')">💎 商品</div>
      <div class="panel-tab" data-tab="tools" onclick="switchTab('tools')">⚡ 工具</div>
    </div>
    <div class="panel-content" id="panelContent">
      <div id="tabCustomer">
        <p style="color:var(--text2);text-align:center;margin-top:40px">选择会话查看客户信息</p>
      </div>
      <div id="tabProduct" style="display:none">
        <input class="search-box" id="productSearch" placeholder="搜索货号或商品名" oninput="searchProducts()">
        <div id="productResults"></div>
      </div>
      <div id="tabTools" style="display:none">
        <p style="color:var(--text2);text-align:center;margin-top:40px">更多工具开发中...</p>
      </div>
    </div>
  </div>
</div>

<script>
// ===== CONFIG =====
const API = 'https://qt1.chengyujewelry.cn';
const ADMIN_KEY = 'rsny@1234';
const SB_URL = 'https://iwczepxmfjfqpdyiilrq.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3Y3plcHhtZmpmcXBkeWlpbHJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1MzcyMTQsImV4cCI6MjA5MTExMzIxNH0.m-_299ReoSkyVeptH2v9fb2IjCRwPnLUWoJATrmrKeU';

const CHANNELS = [
  { id:'wxshop', name:'微信小店', icon:'🛒', color:'var(--wxshop)', accounts:[{id:'wxshop_rsnys', name:'黑岚-RSNY新品推荐官', status:'active'}] },
  { id:'wxmini', name:'小程序', icon:'📱', color:'var(--wxmini)', accounts:[{id:'wxmini_rsnys', name:'泉汀-RSNY官方精品店', status:'active'}] },
  { id:'wechat_official', name:'公众号', icon:'📢', color:'var(--wechat)', accounts:[{id:'wechat_official_rsnys', name:'芮普-公众号', status:'pending'}] },
  { id:'wechat_channels', name:'视频号', icon:'📹', color:'var(--wechat)', accounts:[{id:'wechat_channels_rsnys', name:'芮普-视频号', status:'pending'}] },
  { id:'xiaohongshu', name:'小红书', icon:'📕', color:'var(--xhs)', accounts:[{id:'xhs_rsnys', name:'RSNY小红书', status:'pending'}] },
  { id:'douyin', name:'抖音', icon:'🎵', color:'var(--douyin)', accounts:[{id:'dy_rsnys', name:'RSNY抖音', status:'pending'}] },
];

let state = {
  sessions: [],
  currentSessionId: null,
  currentChannelId: null,
  messages: {},
  quickReplies: [],
  pollTimer: null
};

// ===== LOGIN =====
function doLogin() {
  const pwd = document.getElementById('loginPwd').value;
  if (pwd === ADMIN_KEY) {
    localStorage.setItem('kf_at', pwd);
    showApp();
  } else {
    toast('密码错误', 'error');
  }
}

function showApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'flex';
  init();
}

function checkAuth() {
  if (localStorage.getItem('kf_at') === ADMIN_KEY) { showApp(); return true; }
  return false;
}

// ===== INIT =====
async function init() {
  renderChannelNav();
  await loadQuickReplies();
  await loadSessions();
  startPolling();
}

// ===== CHANNEL NAV =====
function renderChannelNav() {
  const nav = document.getElementById('channelNav');
  nav.innerHTML = CHANNELS.map(ch => {
    const unread = state.sessions.filter(s => s.channel_id === ch.id && s.unread_count > 0).reduce((a,s) => a + s.unread_count, 0);
    return `
    <div class="channel-group">
      <div class="channel-header" onclick="toggleChannel('${ch.id}')">
        <span class="arrow open" id="arrow_${ch.id}">▶</span>
        <span class="channel-icon" style="background:${ch.color}">${ch.icon}</span>
        <span>${ch.name}</span>
        ${unread > 0 ? `<span class="badge">${unread}</span>` : ''}
      </div>
      <div class="channel-accounts" id="accounts_${ch.id}" style="max-height:200px">
        ${ch.accounts.map(a => `
          <div class="account-item ${a.status==='pending'?'':''}' onclick="selectChannel('${ch.id}','${a.id}')" data-channel="${ch.id}" data-account="${a.id}">
            <span style="font-size:12px">${a.status==='pending'?'⏳':'✅'}</span>
            <span>${a.name}</span>
            ${state.sessions.filter(s=>s.channel_id===ch.id).length > 0 ? `<span class="unread badge">${state.sessions.filter(s=>s.channel_id===ch.id).length}</span>` : ''}
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleChannel(id) {
  const el = document.getElementById('accounts_' + id);
  const arrow = document.getElementById('arrow_' + id);
  el.classList.toggle('collapsed');
  arrow.classList.toggle('open');
}

function selectChannel(channelId, accountId) {
  state.currentChannelId = channelId;
  // filter sessions
  renderSessionList();
  // highlight account
  document.querySelectorAll('.account-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.account-item[data-account="${accountId}"]`);
  if (el) el.classList.add('active');
}

// ===== SESSIONS =====
async function loadSessions() {
  try {
    const res = await fetch(`${API}/api/kf/sessions`, { headers: { 'x-admin-key': ADMIN_KEY } });
    state.sessions = await res.json();
    renderSessionList();
    renderChannelNav();
    updateUnreadBadge();
  } catch(e) { console.error('loadSessions', e); }
}

function renderSessionList() {
  const list = document.getElementById('sessionList');
  let sessions = state.sessions;
  if (state.currentChannelId) {
    sessions = sessions.filter(s => s.channel_id === state.currentChannelId);
  }
  if (!sessions.length) {
    list.innerHTML = '<p style="text-align:center;color:var(--text2);padding:20px;font-size:13px">暂无会话</p>';
    return;
  }
  list.innerHTML = sessions.map(s => {
    const ch = CHANNELS.find(c => c.id === s.channel_id);
    const initial = (s.user_nickname || s.user_id || '?').charAt(0).toUpperCase();
    const active = s.id === state.currentSessionId ? 'active' : '';
    const handlerClass = s.handler === 'human' ? 'human' : 'ai';
    const handlerText = s.handler === 'human' ? '人工' : 'AI';
    return `
    <div class="session-item ${active}" onclick="selectSession(${s.id})">
      <div class="session-avatar">${initial}</div>
      <div class="session-info">
        <div class="session-name">
          ${s.user_nickname || s.user_id?.slice(-8) || '未知用户'}
          <span class="handler-tag ${handlerClass}">${handlerText}</span>
        </div>
        <div class="session-preview">${s.last_message_preview || '(暂无消息)'}</div>
        <div class="session-time">${formatTime(s.last_message_at || s.created_at)}</div>
      </div>
      ${s.unread_count > 0 ? `<span class="badge">${s.unread_count}</span>` : ''}
    </div>`;
  }).join('');
}

function updateUnreadBadge() {
  const total = state.sessions.reduce((a, s) => a + (s.unread_count || 0), 0);
  const el = document.getElementById('totalUnread');
  if (total > 0) { el.textContent = total; el.style.display = ''; }
  else { el.style.display = 'none'; }
}

async function selectSession(id) {
  state.currentSessionId = id;
  const session = state.sessions.find(s => s.id === id);
  renderSessionList();
  showChat(session);
  await loadMessages(id);
}

// ===== CHAT =====
function showChat(session) {
  document.getElementById('emptyChat').style.display = 'none';
  document.getElementById('chatView').style.display = 'flex';
  document.getElementById('chatView').style.flexDirection = 'column';
  document.getElementById('chatView').style.flex = '1';
  
  document.getElementById('chatUserName').textContent = session.user_nickname || session.user_id?.slice(-8) || '未知用户';
  
  const ch = CHANNELS.find(c => c.id === session.channel_id);
  const tag = document.getElementById('chatChannelTag');
  tag.textContent = ch ? ch.icon + ' ' + ch.name : session.channel_id;
  tag.style.background = ch ? ch.color : '#909399';
  
  updateHandlerUI(session);
  renderCustomerInfo(session);
}

function updateHandlerUI(session) {
  const htag = document.getElementById('chatHandlerTag');
  const btnTake = document.getElementById('btnTakeover');
  const btnBack = document.getElementById('btnHandback');
  const btnClose = document.getElementById('btnClose');
  const inputArea = document.getElementById('chatInputArea');
  
  if (session.handler === 'human') {
    htag.textContent = '人工接待中'; htag.className = 'handler-tag human';
    btnTake.style.display = 'none'; btnBack.style.display = ''; btnClose.style.display = '';
    inputArea.style.display = '';
  } else {
    htag.textContent = 'AI处理中'; htag.className = 'handler-tag ai';
    btnTake.style.display = ''; btnBack.style.display = 'none'; btnClose.style.display = '';
    inputArea.style.display = 'none';
  }
}

async function loadMessages(sessionId) {
  try {
    const res = await fetch(`${API}/api/kf/sessions/${sessionId}/messages`, { headers: { 'x-admin-key': ADMIN_KEY } });
    const msgs = await res.json();
    state.messages[sessionId] = msgs;
    renderMessages(msgs);
  } catch(e) { console.error('loadMessages', e); }
}

function renderMessages(msgs) {
  const el = document.getElementById('chatMessages');
  if (!msgs.length) {
    el.innerHTML = '<p style="text-align:center;color:var(--text2);padding:20px">暂无消息</p>';
    return;
  }
  el.innerHTML = msgs.map(m => {
    const isReply = m.sender === 'ai' || m.sender === 'human';
    const senderIcon = m.sender === 'ai' ? '🤖' : m.sender === 'human' ? '👤' : '';
    const avatarClass = m.sender === 'ai' ? 'ai' : m.sender === 'human' ? 'human' : 'user';
    const side = isReply ? 'right' : '';
    // content: user message = content field, reply = ai_reply field
    const text = isReply ? (m.ai_reply || m.content) : m.content;
    const senderLabel = m.sender === 'ai' ? 'AI回复' : m.sender === 'human' ? '人工回复' : '客户';
    return `
    <div class="msg-row ${side}">
      <div class="msg-avatar ${avatarClass}">${senderIcon || (m.sender==='user'?'客':'?')}</div>
      <div>
        <div class="msg-sender">${senderLabel}</div>
        <div class="msg-bubble">${escapeHtml(text || '')}</div>
        <div class="msg-time">${formatTime(m.created_at)}</div>
      </div>
    </div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

// ===== ACTIONS =====
async function takeoverSession() {
  if (!state.currentSessionId) return;
  try {
    const res = await fetch(`${API}/api/kf/sessions/${state.currentSessionId}/takeover`, { method:'POST', headers:{'x-admin-key':ADMIN_KEY} });
    const data = await res.json();
    toast('已接管会话', 'success');
    const session = state.sessions.find(s => s.id === state.currentSessionId);
    if (session) { session.handler = 'human'; updateHandlerUI(session); renderSessionList(); }
  } catch(e) { toast('接管失败', 'error'); }
}

async function handbackSession() {
  if (!state.currentSessionId) return;
  try {
    const res = await fetch(`${API}/api/kf/sessions/${state.currentSessionId}/handback`, { method:'POST', headers:{'x-admin-key':ADMIN_KEY} });
    const data = await res.json();
    toast('已交还AI', 'success');
    const session = state.sessions.find(s => s.id === state.currentSessionId);
    if (session) { session.handler = 'ai'; updateHandlerUI(session); renderSessionList(); }
  } catch(e) { toast('交还失败', 'error'); }
}

async function closeSession() {
  if (!state.currentSessionId) return;
  if (!confirm('确定结束此会话？')) return;
  try {
    await fetch(`${API}/api/kf/sessions/${state.currentSessionId}/close`, { method:'POST', headers:{'x-admin-key':ADMIN_KEY} });
    toast('会话已结束', 'info');
    state.currentSessionId = null;
    document.getElementById('chatView').style.display = 'none';
    document.getElementById('emptyChat').style.display = '';
    await loadSessions();
  } catch(e) { toast('操作失败', 'error'); }
}

async function sendMessage() {
  if (!state.currentSessionId) return;
  const input = document.getElementById('msgInput');
  const content = input.value.trim();
  if (!content) return;
  
  try {
    const res = await fetch(`${API}/api/kf/sessions/${state.currentSessionId}/send`, {
      method: 'POST',
      headers: { 'x-admin-key': ADMIN_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ content })
    });
    const data = await res.json();
    if (data.sent) {
      input.value = '';
      toast('发送成功', 'success');
      await loadMessages(state.currentSessionId);
      await loadSessions();
    } else {
      toast('发送失败', 'error');
    }
  } catch(e) { toast('发送失败', 'error'); }
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// ===== RIGHT PANEL =====
function switchTab(tab) {
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('tabCustomer').style.display = tab === 'customer' ? '' : 'none';
  document.getElementById('tabProduct').style.display = tab === 'product' ? '' : 'none';
  document.getElementById('tabTools').style.display = tab === 'tools' ? '' : 'none';
}

function renderCustomerInfo(session) {
  const el = document.getElementById('tabCustomer');
  el.innerHTML = `
    <div class="field"><div class="field-label">昵称</div><div class="field-value">${session.user_nickname || '未知'}</div></div>
    <div class="field"><div class="field-label">来源渠道</div><div class="field-value">${session.source || session.channel_id}</div></div>
    <div class="field"><div class="field-label">用户ID</div><div class="field-value" style="font-size:12px;word-break:break-all">${session.user_id || '-'}</div></div>
    <div class="field"><div class="field-label">处理方式</div><div class="field-value">${session.handler==='human'?'👤 人工':'🤖 AI'}</div></div>
    <div class="field"><div class="field-label">首次接入</div><div class="field-value">${formatTime(session.created_at)}</div></div>
    <div class="field"><div class="field-label">最近活跃</div><div class="field-value">${formatTime(session.last_message_at) || '-'}</div></div>
    <div class="field"><div class="field-label">会话状态</div><div class="field-value">${session.status==='active'?'🟢 进行中':'⏹ 已结束'}</div></div>
  `;
}

// ===== PRODUCTS =====
let productTimer = null;
async function searchProducts() {
  clearTimeout(productTimer);
  const q = document.getElementById('productSearch').value.trim();
  if (!q) { document.getElementById('productResults').innerHTML = ''; return; }
  productTimer = setTimeout(async () => {
    try {
      const res = await fetch(`${API}/api/kf/products/search?q=${encodeURIComponent(q)}`, { headers: {'x-admin-key':ADMIN_KEY} });
      const products = await res.json();
      const el = document.getElementById('productResults');
      if (!products.length) { el.innerHTML = '<p style="color:var(--text2);text-align:center">未找到商品</p>'; return; }
      el.innerHTML = products.map(p => `
        <div class="product-card" onclick="sendProductCard(${p.id})">
          <img src="${(p.images && p.images[0]) || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22/>'}" alt="${p.name}" onerror="this.style.display='none'">
          <div class="name">${p.name || '-'}</div>
          <div style="font-size:12px;color:var(--text2)">${p.product_code || '-'}</div>
          <div class="price">¥${p.price || '-'}</div>
          <button class="btn" style="width:100%;margin-top:6px;font-size:12px" onclick="event.stopPropagation();sendProductCard(${p.id})">发送给客户</button>
        </div>
      `).join('');
    } catch(e) { console.error(e); }
  }, 300);
}

async function sendProductCard(productId) {
  if (!state.currentSessionId) { toast('请先选择会话', 'error'); return; }
  try {
    const res = await fetch(`${API}/api/kf/products/search?q=${productId}`, { headers: {'x-admin-key':ADMIN_KEY} });
    const products = await res.json();
    const p = products[0];
    if (!p) return;
    const content = `💎 ${p.name}（${p.product_code}）¥${p.price}`;
    await fetch(`${API}/api/kf/sessions/${state.currentSessionId}/send`, {
      method: 'POST',
      headers: { 'x-admin-key': ADMIN_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ content })
    });
    toast('已发送商品信息', 'success');
    await loadMessages(state.currentSessionId);
  } catch(e) { toast('发送失败', 'error'); }
}

// ===== QUICK REPLIES =====
async function loadQuickReplies() {
  try {
    const res = await fetch(`${API}/api/kf/quick-replies`, { headers: {'x-admin-key':ADMIN_KEY} });
    state.quickReplies = await res.json();
    renderQuickReplies();
  } catch(e) { console.error(e); }
}

function renderQuickReplies() {
  const bar = document.getElementById('quickReplyBar');
  bar.innerHTML = state.quickReplies.map(r => `<button class="quick-reply-btn" onclick="useQuickReply('${escapeHtml(r.content).replace(/'/g,"\\'")}')">${r.title}</button>`).join('');
}

function useQuickReply(text) {
  document.getElementById('msgInput').value = text;
  document.getElementById('msgInput').focus();
}

// ===== POLLING =====
function startPolling() {
  state.pollTimer = setInterval(async () => {
    await loadSessions();
    if (state.currentSessionId) {
      await loadMessages(state.currentSessionId);
    }
  }, 5000);
}

// ===== UTILS =====
function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  if (isToday) return `${hh}:${mm}`;
  const MM = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${MM}-${dd} ${hh}:${mm}`;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function toast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2000);
}

// ===== BOOT =====
checkAuth();
